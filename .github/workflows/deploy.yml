name: Deploy

# These steps used to come from koraykural-infra's deploy-backend.yml. That
# repo is private now, and a public repo can't call a private repo's workflow.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/ituprogram.koraykural.com
            git pull
            npm ci
            npx prisma migrate deploy
            npm run build
            set -a && [ -f .env ] && source .env && set +a
            pm2 restart ituprogram --update-env
